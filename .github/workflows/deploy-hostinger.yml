# Compila o site a cada push na main e publica a pasta dist/ na branch "hostinger".
# No hPanel da Hostinger (Websites > Avançado > Git), aponte o deploy para a branch
# "hostinger" com destino public_html. A Hostinger só clona o repositório, não roda
# npm, por isso a build precisa estar pronta nessa branch.
name: Build e publicar para a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build

      - name: Publicar dist/ na branch hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'build: ${{ github.sha }}'
